<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
  *{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#edf0f2;color:#25313b}canvas{display:block;width:100%;height:100%}
  .bar{position:fixed;z-index:4;display:flex;gap:6px;flex-wrap:wrap;left:12px;right:12px;top:12px;padding:9px;background:#ffffffed;border:1px solid #d8dee3;border-radius:10px;box-shadow:0 5px 22px #20304020;backdrop-filter:blur(8px)}
  button{border:1px solid #c8d0d7;background:#fff;color:#25313b;padding:7px 10px;border-radius:7px;cursor:pointer}button:hover,button.active{background:#e5f0f7;border-color:#7da8c0}.info{margin-left:auto;align-self:center;color:#52616c;font-size:12px}
  .components{position:fixed;z-index:4;right:12px;top:72px;width:190px;max-height:calc(100% - 92px);overflow:auto;padding:10px;background:#ffffffed;border:1px solid #d8dee3;border-radius:10px;box-shadow:0 5px 22px #20304018}.components h3{font-size:12px;margin:0 0 8px;color:#66737d}.component{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer}.component:hover,.component.active{background:#edf4f8}.swatch{width:12px;height:12px;border-radius:3px;border:1px solid #0002;flex:none}
  .reference{position:fixed;z-index:3;left:12px;bottom:12px;width:min(340px,42vw);background:#fff;border:1px solid #d8dee3;border-radius:10px;box-shadow:0 5px 22px #20304020;overflow:hidden;display:none}.reference.open{display:block}.reference header{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;background:#f5f7f8;font-size:12px}.reference img{display:block;width:100%;max-height:40vh;object-fit:contain;background:white}
  @media(max-width:700px){.bar{top:auto;bottom:8px}.info{width:100%;margin:0}.components{top:8px;right:8px;width:145px;max-height:38vh}.reference{left:8px;bottom:118px;width:44vw}.bar button{padding:6px 8px}}
</style>
<div id="app"></div>
<div class="bar">
  <button data-view="axon" class="active">轴测</button><button data-view="front">正</button><button data-view="side">侧</button><button data-view="top">顶</button><button data-view="back">背</button>
  <button id="reset">复位</button><button id="appearance-toggle">原色</button><button id="reference-toggle">原图对照</button><span class="info" id="info"></span>
</div>
<aside class="components"><h3>组件（点击高亮）</h3><div id="component-list"></div></aside>
<aside class="reference" id="reference"><header><span id="reference-label">原图</span><button id="reference-close">关闭</button></header><img id="reference-image" alt="用户源图"></aside>
<script>__THREE_CLASSIC__</script><script>__ORBIT_CLASSIC__</script>
<script type="application/json" id="state">__STATE_JSON__</script>
<script type="application/json" id="references">__REFERENCES_JSON__</script>
<script>
const THREE=globalThis.THREE,{OrbitControls}=globalThis;
const state=JSON.parse(document.querySelector('#state').textContent),references=JSON.parse(document.querySelector('#references').textContent),host=document.querySelector('#app');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xedf0f2);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=false;host.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-2,2,2,-2,.01,1000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;
scene.add(new THREE.HemisphereLight(0xffffff,0x73808a,2.15));const key=new THREE.DirectionalLight(0xffffff,2.6);key.position.set(-4,8,-5);scene.add(key);const fill=new THREE.DirectionalLight(0xc8d9e3,1.2);fill.position.set(5,4,3);scene.add(fill);
const group=new THREE.Group(),meshes=[],materials=[];scene.add(group);
function scenePositions(values){const output=[];for(let i=0;i<values.length;i+=3)output.push(values[i],values[i+2],-values[i+1]);return output}
for(const component of state.components){const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(scenePositions(component.mesh.positions),3));geometry.setIndex(component.mesh.indices);geometry.computeVertexNormals();geometry.computeBoundingBox();
 const cfg=component.material||{},material=new THREE.MeshStandardMaterial({color:cfg.color||'#d5d1c8',roughness:cfg.roughness??.82,metalness:cfg.metalness??0,side:THREE.DoubleSide,transparent:true,opacity:1});materials.push(material);
 const mesh=new THREE.Mesh(geometry,material);mesh.userData.component=component;group.add(mesh);meshes.push(mesh)}
const box=new THREE.Box3().setFromObject(group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),span=Math.max(size.x,size.y,size.z),groundY=box.min.y-.015;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(span*2.8,span*2.8),new THREE.MeshStandardMaterial({color:0xe7eaec,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(center.x,groundY,center.z);scene.add(ground);
let currentView='axon',appearanceMode='white-model',selected=null;
function fitCamera(direction,up,mirrorX=false){const aspect=innerWidth/innerHeight,padding=1.42;camera.up.copy(up);camera.position.copy(center).add(direction.clone().normalize().multiplyScalar(span*3));camera.lookAt(center);camera.near=.01;camera.far=span*20;const horizontal=size.x,vertical=Math.max(size.y,size.z),half=Math.max(vertical/2,horizontal/(2*aspect))*padding;camera.left=mirrorX?half*aspect:-half*aspect;camera.right=mirrorX?-half*aspect:half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();controls.target.copy(center);controls.update()}
const views={axon:[new THREE.Vector3(-1.15,.9,-1.1),new THREE.Vector3(0,1,0),false],front:[new THREE.Vector3(0,.08,-1),new THREE.Vector3(0,1,0),true],back:[new THREE.Vector3(0,.08,1),new THREE.Vector3(0,1,0),false],side:[new THREE.Vector3(1,.08,0),new THREE.Vector3(0,1,0),false],top:[new THREE.Vector3(0,1,0),new THREE.Vector3(0,0,1),true]};
function view(name){currentView=name;document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===name));fitCamera(...views[name]);if(!selected){materials.forEach((material,index)=>{material.emissive.set(name==='top'?(appearanceMode==='white-model'?'#e7e4de':state.components[index].material?.color||'#d5d1c8'):'#000000');material.emissiveIntensity=name==='top' ? .72 : 0})}if(references[name]){document.querySelector('#reference-image').src=references[name].data;document.querySelector('#reference-label').textContent=references[name].label||`${name} 原图`}}
function select(componentId){selected=selected===componentId?null:componentId;meshes.forEach((mesh,index)=>{const active=mesh.userData.component.componentId===selected;materials[index].emissive.set(active?0x315b70:0x000000);materials[index].emissiveIntensity=active ? .32 : 0;materials[index].opacity=selected&&!active ? .42 : 1});document.querySelectorAll('.component').forEach(row=>row.classList.toggle('active',row.dataset.id===selected))}
const list=document.querySelector('#component-list');for(const component of state.components){const row=document.createElement('div');row.className='component';row.dataset.id=component.componentId;row.innerHTML=`<i class="swatch" style="background:${component.material?.color||'#d5d1c8'}"></i><span>${component.label}</span>`;row.onclick=()=>select(component.componentId);list.append(row)}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',event=>{pointer.x=event.clientX/innerWidth*2-1;pointer.y=-(event.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(meshes,false)[0];if(hit)select(hit.object.userData.component.componentId)});
function setAppearance(mode){if(!['white-model','source-color'].includes(mode))throw new Error(`unsupported appearance: ${mode}`);appearanceMode=mode;state.components.forEach((component,index)=>{const source=component.material||{},material=materials[index];material.color.set(mode==='white-model'?'#e7e4de':source.color||'#d5d1c8');material.roughness=mode==='white-model'?.86:source.roughness??.82;material.metalness=mode==='white-model'?0:source.metalness??0;material.needsUpdate=true});document.body.dataset.appearance=mode;document.querySelector('#appearance-toggle').textContent=mode==='white-model'?'原色':'白模';view(currentView);return mode}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>view(button.dataset.view));document.querySelector('#reset').onclick=()=>view('axon');document.querySelector('#appearance-toggle').onclick=()=>setAppearance(appearanceMode==='white-model'?'source-color':'white-model');
window.__PRODUCT_APPEARANCE__={getMode:()=>appearanceMode,setMode:setAppearance,supportedModes:['white-model','source-color'],geometryStateSha256:state.stateSha256};
window.__PRODUCT_STANDALONE_READY__={schema:'single-product-standalone-v1',stateSha256:state.stateSha256,defaultAppearanceMode:'white-model'};
const reference=document.querySelector('#reference');document.querySelector('#reference-toggle').onclick=()=>reference.classList.toggle('open');document.querySelector('#reference-close').onclick=()=>reference.classList.remove('open');
document.querySelector('#info').textContent=`${state.stateSha256.slice(0,12)} · ${state.status} · ${state.geometryMethod}`;
function resize(){renderer.setSize(innerWidth,innerHeight);view(currentView)}addEventListener('resize',resize);resize();setAppearance('white-model');view(new URLSearchParams(location.search).get('view')||'axon');renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</html>
