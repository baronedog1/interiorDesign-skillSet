interface:
  display_name: "室内设计视频制作"
  short_description: "把已确认的设计图编排成分镜并生成室内设计视频"
  default_prompt: "当用户要求把已确认的室内效果图、机位图或单品图制作成空间漫游、方案讲解、家具展示、材质细节、社区预告或虚拟设计师口播视频时使用。先锁定当前版本，写中文台词和逐秒分镜，生成粗线稿 storyboard 与 HTML 审阅页，再做不扣费的 Seedance dry-run；只有用户明确确认方案和费用后，才从设备受管 secret 做零费用鉴权预检并串行真实生成，失败即停。户型规划、建模、机位、效果图、PDF、平台项目上传和社区发布交给各自 Skill。"
