<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000pt" height="1995pt" viewBox="0 0 2000 1995"><rect width="2000" height="1995" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="30" y="48" font-size="20" fill="#172F43" font-weight="700">当前户型到精细整屋模型 / 总图：从当前户型制作精细模型并交付</text><text x="30" y="73" font-size="10.2" fill="#4B6172" font-weight="500">SPM 14.4.0 · schema 5 · 从触发到交付的完整流程 · 深蓝节点可展开</text><rect x="24" y="84" width="1952" height="33" rx="5" fill="#F3F6F8"/><text x="36" y="103" font-size="11" fill="#172F43" font-weight="400">触发：用户确认 HTML 布局后明确要求 Blender 精细模型或 Blender 原生机位图时调用。；输入：用户提供当前户型事实并要求 Blender 整屋工程或原生机位图片；输出：自包含模型、派生文件、原生清单、按请求制作的图片及真实限制</text><g transform="translate(24,129)"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#596F80"/></marker></defs><g transform="translate(0,0)"><polyline data-from="input" data-to="prepare" points="578,402.5 666,402.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="prepare" data-to="build" points="1286,402.5 1374,402.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="build" data-to="verify" points="1634,622 1634,823" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="verify" data-to="want" points="1374,954.5 1286,954.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="want" data-to="capture" points="1137.2,1040 1137.2,1167.5 976,1167.5 976,1189.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="want" data-to="organize" points="666,910.04 453.2,910.04 453.2,1162" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="capture" data-to="organize" points="666,1319.5 600,1319.5 600,1401.4 578,1401.4" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="organize" data-to="deliver" points="318,1477 318,1553" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g id="node-main-input" data-node="input"><rect x="58" y="310" width="520" height="185" rx="8" fill="#EAF6EF" stroke="#4F8D70" stroke-width="2"/><path d="M 553 332 h12 l-3 10 h-12 Z" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="404.759" x2="561" y2="404.759" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="339.5" font-size="10.5" fill="#15548D" font-weight="700">开始 · 用户提供</text><text x="75" y="366.385" font-size="18" fill="#172F43" font-weight="700">用户给当前户型并要求精细整屋模型</text><text x="75" y="390.245" font-size="12.2" fill="#172F43" font-weight="400">明确要求 Blender 工程或原生机位图时调用；默认由当前代理完成。</text><text x="75" y="422.959" font-size="10.2" fill="#263F52" font-weight="500">[入口] SKILL.md</text><text x="75" y="439.033" font-size="10.3" fill="#4B6172" font-weight="400">定义触发、事实源、精细资产、PBR 材质和禁止事项。</text><text x="75" y="458.044" font-size="10.2" fill="#263F52" font-weight="500">[配置] agents/openai.yaml</text><text x="75" y="474.11800000000005" font-size="10.3" fill="#4B6172" font-weight="400">提供 Codex 默认调用提示。</text></g><g id="node-main-prepare" data-node="prepare"><rect x="666" y="58" width="620" height="689" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="1261" y="80" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="683" y1="199.91299999999998" x2="1269" y2="199.91299999999998" stroke="#D8E0E6" stroke-width=".8"/><text x="683" y="100" font-size="18" fill="#172F43" font-weight="700">核对布局、审定资产和本机条件</text><text x="683" y="123.86" font-size="12.2" fill="#172F43" font-weight="400">读取同项目、同版本的墙门窗、房间与家具尺寸位置。</text><text x="683" y="145.574" font-size="12.2" fill="#172F43" font-weight="400">缺素材时仅获取已审定的免费或 CC0 资源；付费或受限资源按已有授权处理。</text><text x="683" y="167.288" font-size="12.2" fill="#172F43" font-weight="400">身份冲突、文件缺失、摘要变化或本机依赖受阻时，记录具体原因及可用文件。</text><text x="683" y="186.102" font-size="10.3" fill="#4B6172" font-weight="400">补充：输入为 current-model/coauthoring-model 与同版 structure；HTML 几何不导入 Blender。</text><text x="683" y="218.11299999999997" font-size="10.2" fill="#263F52" font-weight="500">[方法] data_contract.md</text><text x="683" y="234.18699999999998" font-size="10.3" fill="#4B6172" font-weight="400">规定输入、输出、选型、PBR 材质与朝向字段。</text><text x="683" y="253.19799999999995" font-size="10.2" fill="#263F52" font-weight="500">[方法] local_runtime.md</text><text x="683" y="269.27199999999993" font-size="10.3" fill="#4B6172" font-weight="400">记录 Ubuntu 正式命令。</text><text x="683" y="288.2829999999999" font-size="10.2" fill="#263F52" font-weight="500">[方法] ENVIRONMENT_CONTRACT.md</text><text x="683" y="304.35699999999997" font-size="10.3" fill="#4B6172" font-weight="400">说明权威源、Ubuntu 运行时、资产仓、材质仓、渲染盒和同步关系。</text><text x="683" y="323.36799999999994" font-size="10.2" fill="#263F52" font-weight="500">[方法] templates.md</text><text x="683" y="339.44199999999995" font-size="10.3" fill="#4B6172" font-weight="400">说明唯一模板、组件资产与 PBR 材质。</text><text x="683" y="358.4529999999999" font-size="10.2" fill="#263F52" font-weight="500">[方法] references/architecture.md</text><text x="683" y="374.52699999999993" font-size="10.3" fill="#4B6172" font-weight="400">解释三层职责。</text><text x="683" y="393.5379999999999" font-size="10.2" fill="#263F52" font-weight="500">[方法] references/contracts.md</text><text x="683" y="409.6119999999999" font-size="10.3" fill="#4B6172" font-weight="400">列出交接合同。</text><text x="683" y="428.6229999999999" font-size="10.2" fill="#263F52" font-weight="500">[数据] assets/blender-component-library/catalog.json</text><text x="683" y="444.6969999999999" font-size="10.3" fill="#4B6172" font-weight="400">登记 Blender 同类多款精细资产、选型和朝向合同。</text><text x="683" y="463.70799999999986" font-size="10.2" fill="#263F52" font-weight="500">[数据] assets/blender-component-library/precision-asset-acquisition.v1.json</text><text x="683" y="479.78199999999987" font-size="10.3" fill="#4B6172" font-weight="400">登记人工审过的免费资产 ID。</text><text x="683" y="498.79299999999984" font-size="10.2" fill="#263F52" font-weight="500">[数据] assets/blender-component-library/acquisition-manifest.v1.json</text><text x="683" y="514.8669999999998" font-size="10.3" fill="#4B6172" font-weight="400">记录实际获取资产的来源、许可、大小和摘要。</text><text x="683" y="533.8779999999998" font-size="10.2" fill="#263F52" font-weight="500">[数据] assets/blender-material-library/catalog.json</text><text x="683" y="549.9519999999998" font-size="10.3" fill="#4B6172" font-weight="400">登记墙面、天花、木地板和瓷砖 PBR 模板及物理映射。</text><text x="683" y="568.9629999999997" font-size="10.2" fill="#263F52" font-weight="500">[数据] assets/blender-material-library/material-acquisition.v1.json</text><text x="683" y="585.0369999999998" font-size="10.3" fill="#4B6172" font-weight="400">登记人工审定的 Poly Haven CC0 材质。</text><text x="683" y="604.0479999999999" font-size="10.2" fill="#263F52" font-weight="500">[数据] assets/blender-material-library/acquisition-manifest.v1.json</text><text x="683" y="620.1219999999998" font-size="10.3" fill="#4B6172" font-weight="400">记录实际获取 PBR 材质的来源、许可、文件大小和摘要。</text><text x="683" y="639.1329999999999" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/acquire_blenderkit_assets.py</text><text x="683" y="655.2069999999999" font-size="10.3" fill="#4B6172" font-weight="400">获取审定免费资产并生成审计清单。</text><text x="683" y="674.218" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/acquire_polyhaven_materials.py</text><text x="683" y="690.2919999999999" font-size="10.3" fill="#4B6172" font-weight="400">获取审定 CC0 PBR 材质并生成审计清单。</text><text x="683" y="709.303" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/init_blender_model_project.py</text><text x="683" y="725.377" font-size="10.3" fill="#4B6172" font-weight="400">建立 v5 项目并绑定组件与材质 catalog。</text></g><g id="node-main-build" data-node="build"><rect x="1374" y="183" width="520" height="439" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="1869" y="205" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="1391" y1="355.738" x2="1877" y2="355.738" stroke="#D8E0E6" stroke-width=".8"/><text x="1391" y="225" font-size="18" fill="#172F43" font-weight="700">按房间选款并制作精细模型</text><text x="1391" y="248.86" font-size="12.2" fill="#172F43" font-weight="400">同功能类按房间风格选款，先统一来源轴，再按确认尺寸和朝向装配。</text><text x="1391" y="270.574" font-size="12.2" fill="#172F43" font-weight="400">墙、顶、干湿区地面读取登记贴图，按真实尺度映射；素材缺失不以方盒或色块</text><text x="1391" y="287.288" font-size="12.2" fill="#172F43" font-weight="400">补位。</text><text x="1391" y="309.002" font-size="12.2" fill="#172F43" font-weight="400">编辑时用连续首次接触计算位移；客户当前布局和修改留在本项目。</text><text x="1391" y="327.81600000000003" font-size="10.3" fill="#4B6172" font-weight="400">补充：坐标转换 [x,y,z] → [x,-z,y]；贴图为 Diffuse/Roughness/Normal；模型保存为自包含</text><text x="1391" y="341.927" font-size="10.3" fill="#4B6172" font-weight="400"> .blend 和派生 GLB。</text><text x="1391" y="373.938" font-size="10.2" fill="#263F52" font-weight="500">[方法] playbook.md</text><text x="1391" y="390.012" font-size="10.3" fill="#4B6172" font-weight="400">说明唯一执行流程。</text><text x="1391" y="409.02299999999997" font-size="10.2" fill="#263F52" font-weight="500">[方法] scripts_logic.md</text><text x="1391" y="425.097" font-size="10.3" fill="#4B6172" font-weight="400">登记脚本职责。</text><text x="1391" y="444.10799999999995" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/build_floorplan_scene.py</text><text x="1391" y="460.18199999999996" font-size="10.3" fill="#4B6172" font-weight="400">唯一 Blender PBR 编译器。</text><text x="1391" y="479.1929999999999" font-size="10.2" fill="#263F52" font-weight="500">[模块] scripts/common.py</text><text x="1391" y="495.26699999999994" font-size="10.3" fill="#4B6172" font-weight="400">JSON 与摘要函数。</text><text x="1391" y="514.2779999999999" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/resolve_component_motion.py</text><text x="1391" y="530.3519999999999" font-size="10.3" fill="#4B6172" font-weight="400">连续首次接触计算。</text><text x="1391" y="549.3629999999998" font-size="10.2" fill="#263F52" font-weight="500">[数据] assets/blender-style-presets/warm-modern-neutral.json</text><text x="1391" y="565.4369999999999" font-size="10.3" fill="#4B6172" font-weight="400">登记房间选型、结构 PBR 模板、Eevee 灯光和贴图预算。</text><text x="1391" y="584.4479999999999" font-size="10.2" fill="#263F52" font-weight="500">[配置] assets/blender-template/backend-options.json</text><text x="1391" y="600.5219999999999" font-size="10.3" fill="#4B6172" font-weight="400">固定后端、材质事实源与 Eevee 原生渲染选项。</text></g><g id="node-main-want" data-node="want"><rect x="666" y="869" width="620" height="171" rx="8" fill="#FFF8EB" stroke="#D8BA81" stroke-width="1.1"/><path d="M 1266 890 l 6 6 -6 6 -6 -6 Z" fill="none" stroke="#91651B" stroke-width="1.6"/><line x1="683" y1="949.374" x2="1269" y2="949.374" stroke="#D8E0E6" stroke-width=".8"/><text x="683" y="911" font-size="18" fill="#172F43" font-weight="700">用户是否需要原生机位图片？</text><text x="683" y="934.86" font-size="12.2" fill="#172F43" font-weight="400">按用户要求选择交付范围；受阻模型只整理已有结果和原因。</text><text x="683" y="967.574" font-size="10.2" fill="#263F52" font-weight="500">[入口] SKILL.md</text><text x="683" y="983.648" font-size="10.3" fill="#4B6172" font-weight="400">定义触发、事实源、精细资产、PBR 材质和禁止事项。</text><text x="683" y="1002.659" font-size="10.2" fill="#263F52" font-weight="500">[方法] playbook.md</text><text x="683" y="1018.733" font-size="10.3" fill="#4B6172" font-weight="400">说明唯一执行流程。</text></g><g id="node-main-verify" data-node="verify"><rect x="1374" y="823" width="520" height="263" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="1869" y="845" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="1391" y1="925.088" x2="1877" y2="925.088" stroke="#D8E0E6" stroke-width=".8"/><text x="1391" y="865" font-size="18" fill="#172F43" font-weight="700">重新打开模型并核对真实结果</text><text x="1391" y="888.86" font-size="12.2" fill="#172F43" font-weight="400">核对集合、组件身份、素材摘要、朝向和贴图打包，登记未匹配项及技术失败。</text><text x="1391" y="910.574" font-size="12.2" fill="#172F43" font-weight="400">生成原生模型清单和真实网格审计数据；失败只修对应输入、登记或编译器。</text><text x="1391" y="943.288" font-size="10.2" fill="#263F52" font-weight="500">[验证] scripts/validate_blender_scene.py</text><text x="1391" y="959.362" font-size="10.3" fill="#4B6172" font-weight="400">重开验证原生模型。</text><text x="1391" y="978.373" font-size="10.2" fill="#263F52" font-weight="500">[验证] scripts/test_mcp_connection.py</text><text x="1391" y="994.447" font-size="10.3" fill="#4B6172" font-weight="400">连接和重开检查。</text><text x="1391" y="1013.458" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/export_native_model_manifest.py</text><text x="1391" y="1029.532" font-size="10.3" fill="#4B6172" font-weight="400">生成原生模型清单。</text><text x="1391" y="1048.543" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/export_camera_scene.py</text><text x="1391" y="1064.617" font-size="10.3" fill="#4B6172" font-weight="400">导出网格语义审计包。</text></g><g id="node-main-organize" data-node="organize"><rect x="58" y="1162" width="520" height="315" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="553" y="1184" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="1280.802" x2="561" y2="1280.802" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="1204" font-size="18" fill="#172F43" font-weight="700">整理交付范围、使用说明与登记</text><text x="75" y="1227.86" font-size="12.2" fill="#172F43" font-weight="400">普通任务整理可交付模型、图片与真实限制；模型受阻时说明原因和已有成果。</text><text x="75" y="1249.574" font-size="12.2" fill="#172F43" font-weight="400">只有修改本 Skill 规则、代码或目录时，更新版本、文件登记和同源说明书；不增</text><text x="75" y="1266.288" font-size="12.2" fill="#172F43" font-weight="400">加建模前置检查。</text><text x="75" y="1299.002" font-size="10.2" fill="#263F52" font-weight="500">[登记] MANIFEST.json</text><text x="75" y="1315.076" font-size="10.3" fill="#4B6172" font-weight="400">登记版本和全部活动文件。</text><text x="75" y="1334.087" font-size="10.2" fill="#263F52" font-weight="500">[图源] manual/skill-manual.json</text><text x="75" y="1350.161" font-size="10.3" fill="#4B6172" font-weight="400">说明书唯一结构化事实源。</text><text x="75" y="1369.172" font-size="10.2" fill="#263F52" font-weight="500">[交付] manual/skill-manual.md</text><text x="75" y="1385.2459999999999" font-size="10.3" fill="#4B6172" font-weight="400">AI 可读说明书。</text><text x="75" y="1404.2569999999998" font-size="10.2" fill="#263F52" font-weight="500">[交付] manual/skill-flowchart.svg</text><text x="75" y="1420.331" font-size="10.3" fill="#4B6172" font-weight="400">流程总览。</text><text x="75" y="1439.3419999999999" font-size="10.2" fill="#263F52" font-weight="500">[交付] manual/skill-manual.html</text><text x="75" y="1455.416" font-size="10.3" fill="#4B6172" font-weight="400">提供可放大、按文件定位和跳转的同源使用说明</text></g><g id="node-main-capture" data-node="capture"><rect x="666" y="1189.5" width="620" height="260" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="1261" y="1211.5" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="683" y1="1323.81" x2="1269" y2="1323.81" stroke="#D8E0E6" stroke-width=".8"/><text x="683" y="1231.5" font-size="18" fill="#172F43" font-weight="700">用同版机位逐张拍摄房间</text><text x="683" y="1255.36" font-size="12.2" fill="#172F43" font-weight="400">读取 Camera 已冻结机位，逐图使用独立进程并清理非目标房间资产。</text><text x="683" y="1277.074" font-size="12.2" fill="#172F43" font-weight="400">记录请求、成功和失败数量；实际图片及回执与本次模型绑定。</text><text x="683" y="1295.888" font-size="10.3" fill="#4B6172" font-weight="400">补充：固定 plan 的 position/target/FOV/windowCenter/显隐与裁切；Eevee 960×600、16 samples、AgX；遵守现</text><text x="683" y="1309.999" font-size="10.3" fill="#4B6172" font-weight="400">有渲染盒限额。</text><text x="683" y="1342.01" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/capture_blender_batch.py</text><text x="683" y="1358.084" font-size="10.3" fill="#4B6172" font-weight="400">逐图隔离截图批处理。</text><text x="683" y="1377.095" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/capture_blender_views.py</text><text x="683" y="1393.1689999999999" font-size="10.3" fill="#4B6172" font-weight="400">目标房间剪枝与 Eevee 冻结机位适配器。</text><text x="683" y="1412.1799999999998" font-size="10.2" fill="#263F52" font-weight="500">[方法] local_runtime.md</text><text x="683" y="1428.254" font-size="10.3" fill="#4B6172" font-weight="400">记录 Ubuntu 正式命令。</text></g><g id="node-main-deliver" data-node="deliver"><rect x="58" y="1553" width="520" height="207" rx="8" fill="#EAF6EF" stroke="#4F8D70" stroke-width="2"/><path d="M 553 1575 h12 l-3 10 h-12 Z" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="1669.473" x2="561" y2="1669.473" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="1582.5" font-size="10.5" fill="#15548D" font-weight="700">结束 · 本次交付</text><text x="75" y="1609.385" font-size="18" fill="#172F43" font-weight="700">用户拿到精细模型和所需图片</text><text x="75" y="1633.2450000000001" font-size="12.2" fill="#172F43" font-weight="400">交付可重开的模型、原生清单、请求的机位图与回执；未完成项单独说明。</text><text x="75" y="1654.959" font-size="12.2" fill="#172F43" font-weight="400">平台上传仍沿用已有授权与平台 Skill。</text><text x="75" y="1687.673" font-size="10.2" fill="#263F52" font-weight="500">[入口] SKILL.md</text><text x="75" y="1703.747" font-size="10.3" fill="#4B6172" font-weight="400">定义触发、事实源、精细资产、PBR 材质和禁止事项。</text><text x="75" y="1722.758" font-size="10.2" fill="#263F52" font-weight="500">[交付] SKILL_MANUAL.pdf</text><text x="75" y="1738.8319999999999" font-size="10.3" fill="#4B6172" font-weight="400">提供从用户输入到交付的中文流程图和使用说明</text></g><g><rect x="1143.2" y="1092.75" width="104.69999999999999" height="22" rx="3" fill="white"/><text x="1149.2" y="1107.75" font-size="10.3" fill="#172F43" font-weight="500">需要图片且模型可用</text></g><g><rect x="507.25" y="883.04" width="104.69999999999999" height="22" rx="3" fill="white"/><text x="513.25" y="898.04" font-size="10.3" fill="#172F43" font-weight="500">只要模型或本次受阻</text></g><g><rect x="582.9" y="1278.5" width="73.8" height="36" rx="3" fill="white"/><text x="588.9" y="1293.5" font-size="10.3" fill="#172F43" font-weight="500">图片与实际回</text><text x="588.9" y="1307.5" font-size="10.3" fill="#172F43" font-weight="500">执</text></g></g></g><text x="30" y="1977" font-size="9.2" fill="#4B6172" font-weight="400">从绿色“开始”顺箭头读到“结束”。深蓝D节点可展开；小字用于查具体文件。</text><text x="1970" y="1977" text-anchor="end" font-size="9.2" fill="#4B6172">1 / 1</text></g></svg>