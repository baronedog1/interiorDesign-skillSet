interface:
  display_name: "Blender 户型建模"
  short_description: "按房间风格匹配 Blender 精细资产并输出 Eevee 材质整屋"
  default_prompt: "使用 $interior-blender-modeling 只读取项目唯一 current-model.json 与同版 structure-data.json 的户型和家具 transform，按功能类、房间和风格标签选择 Blender 精细资产，归一来源轴。墙、天花、干区木地板和湿区陶瓷砖必须读取受管 CC0 PBR 模板，以物理尺度 Box 投影并打包进自包含 blend。禁止 HTML GLB、程序材质回退、方盒和 Workbench 正式图。截图复用同一 Camera v3 plan，每张剪除非目标房间数据后用 Eevee/AgX 渲染。"
