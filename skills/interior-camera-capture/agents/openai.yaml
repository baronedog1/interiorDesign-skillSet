interface:
  display_name: "Interior Camera Capture"
  short_description: "当前HTML只求解一次，Blender与CAD复用同一冻结计划"
  default_prompt: "使用 $interior-camera-capture 先从项目唯一当前 HTML 生成正式机位。卫浴、阳台和洗衣设备优先从正面侧拍摄，多主体投影避免互相严重遮挡；仍只从严格墙法线候选中选择。全部候选都有质量提示时仍交付最佳可用镜头。冻结 plan 后 Blender 和 CAD 必须复用同一 SHA-256，不得重新求解。效果图直接读取同名 camera-image-facts.v3 与 PNG，不再生成 scene-map 中转。"
