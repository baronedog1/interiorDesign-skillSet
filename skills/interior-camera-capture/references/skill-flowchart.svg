<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1697" viewBox="0 0 2400 1697"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#111"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}</style></defs><rect width="2400" height="1697" fill="#fff"/><text x="42" y="55" font-size="30" font-weight="800" text-anchor="start"><tspan x="42" dy="0">室内空间唯一机位生成与截图 / Skill 总览</tspan></text><text x="42" y="91" font-size="17" font-weight="430" text-anchor="start"><tspan x="42" dy="0">只有一条客户生产链：当前 HTML → 唯一求解器 → 冻结一次 → HTML/Blender/CAD 原样截图与事实 JSON。</tspan></text><line x1="42" y1="112" x2="2358" y2="112" stroke="#111" stroke-width="2"/><g><polyline points="540,685 850,685" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="644" y="653" width="102" height="24" rx="3" fill="#fff" fill-opacity="0.94"/><text x="695" y="669.08" text-anchor="middle" font-size="12" font-weight="600" fill="#111"><tspan x="695" dy="0">当前模型与结构</tspan></text></g><g><polyline points="1550,685 1850,685" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1637" y="653" width="126" height="24" rx="3" fill="#fff" fill-opacity="0.94"/><text x="1700" y="669.08" text-anchor="middle" font-size="12" font-weight="600" fill="#111"><tspan x="1700" dy="0">冻结机位和正式图片</tspan></text></g><g data-scenario-input="capture-current-model"><g><polygon points="96,560 540,560 514,810 70,810" fill="#fff" stroke="#111" stroke-width="2"/><text x="305" y="662.25" text-anchor="middle" font-size="16" font-weight="700" fill="#111"><tspan x="305" dy="0">输入当前后端整屋模型</tspan></text><text x="305" y="681.75" text-anchor="middle" font-size="10.5" font-weight="430" fill="#111"><tspan x="305" dy="0">[这一步谁做什么] 用户或上游建模 Skill 提供项目当前 HTML、同一版户型结构和可选原生后端</tspan><tspan x="305" dy="14">模型；机位只能从当前 HTML 求解一次。</tspan><tspan x="305" dy="14">[这一步会做] HTML、Blender 或 CAD 与同版结构数据</tspan><tspan x="305" dy="14">[使用文件] SKILL.md；这个文件用来说明何时调用机位 Skill 以及正式交付边界。</tspan></text></g></g><g><g><rect x="850" y="500" width="700" height="370" rx="5" fill="#f1f1f1" stroke="#111" stroke-width="2"/><text x="1200" y="662.25" text-anchor="middle" font-size="16" font-weight="700" fill="#111"><tspan x="1200" dy="0">HTML求解一次，后端复用冻结计划</tspan></text><text x="1200" y="681.75" text-anchor="middle" font-size="10.5" font-weight="430" fill="#111"><tspan x="1200" dy="0">[这一步谁做什么] 机位 Agent 先用HTML冻结计划；Blender和CAD只负责原生渲染，不得再次求解或移动相机。</tspan><tspan x="1200" dy="14">[这一步会做] HTML模板调用唯一求解器，Blender和CAD模板只能消费结果</tspan><tspan x="1200" dy="14">[使用文件] scripts/run_camera_pipeline.py；这个文件用来固定串起场景生成、机位求解、原生事实收敛和正式截图。</tspan><tspan x="1200" dy="14">[使用文件] scripts/unified_camera_solver.py；这个文件用来作为唯一拥有机位决策权的代码文件。</tspan></text></g></g><g><g><path d="M 1850 548 A 235 13 0 0 1 2320 548 L 2320 822 A 235 13 0 0 1 1850 822 Z" fill="#fff" stroke="#111" stroke-width="2"/>
      <ellipse cx="2085" cy="548" rx="235" ry="13" fill="#fff" stroke="#111" stroke-width="2"/>
      <path d="M 1850 822 A 235 13 0 0 0 2320 822" fill="none" stroke="#111" stroke-width="2"/><text x="2085" y="648.25" text-anchor="middle" font-size="16" font-weight="700" fill="#111"><tspan x="2085" dy="0">交付截图与同名事实 JSON</tspan></text><text x="2085" y="667.75" text-anchor="middle" font-size="10.5" font-weight="430" fill="#111"><tspan x="2085" dy="0">[这一步谁做什么] 机位 Agent 保存完整截图和机器可复核事实；效果图流程直接读取这对文件，</tspan><tspan x="2085" dy="14">不再等待 scene-map 中转。</tspan><tspan x="2085" dy="14">[这一步会做] 每个空间一张正式 PNG</tspan><tspan x="2085" dy="14">[这一步会做] 同名 JSON 记录相机、主体和入画对象</tspan><tspan x="2085" dy="14">[使用文件] data_contract.md；这个文件用来规定计划、图片、事实 JSON 和直接下游交接分别</tspan><tspan x="2085" dy="14">保存什么。</tspan></text></g></g><line x1="42" y1="1660" x2="2358" y2="1660" stroke="#aaa"/><text x="42" y="1682" font-size="12.5" fill="#555">唯一来源：references/skill-manual.json</text><text x="2358" y="1682" text-anchor="end" font-size="12.5" fill="#555">1 / 1</text></svg>