<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1697" viewBox="0 0 2400 1697">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#111"/></marker>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif;letter-spacing:0}</style>
</defs>
<rect width="2400" height="1697" fill="#fff"/>
<text x="42" y="55" font-size="30" font-weight="800">小酷设计编排与杂志式方案册 / 能力总览</text>
<text x="42" y="91" font-size="17" fill="#333">版本 4.1.0</text>
<line x1="42" y1="112" x2="2358" y2="112" stroke="#111" stroke-width="2"/>
<g><polyline points="410,490 410,600" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polyline points="410,860 410,1010" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polyline points="740,1150 870,1150" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polyline points="1200,1010 1200,860" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polyline points="1200,600 1200,510" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polyline points="1530,385 1710,385" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1584" y="342" width="72" height="31" rx="3" fill="#fff" fill-opacity="0.94"/><text x="1620" y="363.62" text-anchor="middle" font-size="18" font-weight="600" fill="#111"><tspan x="1620" dy="0">否</tspan></text></g><g><polyline points="1530,385 1600,385 1600,775 1710,775" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1612" y="564.5" width="72" height="31" rx="3" fill="#fff" fill-opacity="0.94"/><text x="1648" y="586.12" text-anchor="middle" font-size="18" font-weight="600" fill="#111"><tspan x="1648" dy="0">是</tspan></text></g><g><polyline points="2010,910 2010,1110" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polygon points="106,270 740,270 714,490 80,490" fill="#fff" stroke="#111" stroke-width="2"/><text x="410" y="333" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="410" dy="0">客户原图 + 偏好 + 交付目标</tspan></text><text x="116" y="366" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="116" dy="0">先区分完整方案、图片或单一步骤任务。</tspan><tspan x="116" dy="26">已有同版可靠成果按需复用，不强制重跑。</tspan><tspan x="116" dy="26"></tspan><tspan x="116" dy="26">SKILL.md：方案册调用边界</tspan></text></g><g><rect x="80" y="600" width="660" height="260" rx="5" fill="#f1f1f1" stroke="#111" stroke-width="2"/><text x="410" y="670" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="410" dy="0">规划 JSON → 代码生成整户型</tspan></text><text x="100" y="703" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="100" dy="0">规划：尺寸、拓扑、门窗、通路与家具锚点。</tspan><tspan x="100" dy="26">HTML：严格按代码生成；错在源头就改源头。</tspan><tspan x="100" dy="26">不把漂亮风格参考图当成客户户型。</tspan><tspan x="100" dy="26"></tspan><tspan x="100" dy="26">playbook.md：接收上游事实，不另造布局</tspan></text></g><g><rect x="80" y="1010" width="660" height="280" rx="5" fill="#f1f1f1" stroke="#111" stroke-width="2"/><text x="410" y="1116" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="410" dy="0">初始机位看布局 → 用户风格入模</tspan></text><text x="100" y="1149" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="100" dy="0">先看真实空间关系，再按用户偏好应用 CMF。</tspan><tspan x="100" dy="26">平台资产按需获取，指定家具保持尺寸比例。</tspan><tspan x="100" dy="26">改风格不默认改户型或家具摆放。</tspan></text></g><g><rect x="870" y="1010" width="660" height="280" rx="5" fill="#f1f1f1" stroke="#111" stroke-width="2"/><text x="1200" y="1116" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="1200" dy="0">保存风格版 → 正式机位与截图</tspan></text><text x="890" y="1149" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="890" dy="0">只改 CMF 可复用机位几何，但刷新同版截图。</tspan><tspan x="890" dy="26">改结构或家具包络，重新求解受影响视角。</tspan><tspan x="890" dy="26">旧截图不能配新模型。</tspan></text></g><g><rect x="870" y="600" width="660" height="260" rx="5" fill="#f1f1f1" stroke="#111" stroke-width="2"/><text x="1200" y="696" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="1200" dy="0">原生绘图：同机位、同结构</tspan></text><text x="890" y="729" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="890" dy="0">默认带完整活动家具与细节。</tspan><tspan x="890" dy="26">用户明确要求才使用白模／空白槽位。</tspan><tspan x="890" dy="26">精细化普通家具；指定资产不变形、不失真。</tspan></text></g><g><polygon points="1200,260 1530,385 1200,510 870,385" fill="#fff" stroke="#111" stroke-width="2"/><text x="1200" y="355.8" text-anchor="middle" font-size="20" font-weight="700" fill="#111"><tspan x="1200" dy="0">交付目标是完整方案册？</tspan></text><text x="1002" y="384.90000000000003" text-anchor="start" font-size="17" font-weight="430" fill="#111"><tspan x="1002" dy="0">是：编排 PDF；否：按指定格式交付。</tspan><tspan x="1002" dy="22.1"></tspan><tspan x="1002" dy="22.1">SKILL.md：触发判断</tspan></text></g><g><polygon points="1736,260 2310,260 2284,500 1710,500" fill="#fff" stroke="#111" stroke-width="2"/><text x="2010" y="359" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="2010" dy="0">否：发送图片／HTML／JSON</tspan></text><text x="1746" y="392" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="1746" dy="0">用户要图片就发图片，不强塞 PDF。</tspan><tspan x="1746" dy="26">实际发送成功才算交付。</tspan></text></g><g><rect x="1710" y="640" width="600" height="270" rx="5" fill="#f1f1f1" stroke="#111" stroke-width="2"/><text x="2010" y="715" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="2010" dy="0">是：第六项 booklet-production</tspan></text><text x="1730" y="748" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="1730" dy="0">同版布局、风格、效果、材料组成方案册。</tspan><tspan x="1730" dy="26">缺实际渲染只能标阶段方案。</tspan><tspan x="1730" dy="26"></tspan><tspan x="1730" dy="26">playbook.md：杂志式内容编排</tspan><tspan x="1730" dy="26">data_contract.md：brief 输入与来源</tspan></text></g><g><polygon points="1736,1110 2310,1110 2284,1350 1710,1350" fill="#fff" stroke="#111" stroke-width="2"/><text x="2010" y="1209" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="2010" dy="0">发送完整方案 PDF</tspan></text><text x="1746" y="1242" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="1746" dy="0">平台上传按需调用平台 Skill。</tspan><tspan x="1746" dy="26">方案册不自动等于施工图、报价或采购承诺。</tspan></text></g>
<line x1="42" y1="1660" x2="2358" y2="1660" stroke="#aaa" stroke-width="1"/>
<text x="42" y="1682" font-size="12.5" fill="#555">当前实现：图内列明执行逻辑、对应文件与用途。</text>
<text x="2358" y="1682" text-anchor="end" font-size="12.5" fill="#555">1 / 1</text>
</svg>