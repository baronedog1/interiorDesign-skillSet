interface:
  display_name: "室内户型人机共创模板"
  short_description: "用唯一模板生成可编辑户型、精细家具与场景模型"
  default_prompt: "使用 $interior-html-modeling 将 floorplan-handoff.v3 直接编译为唯一的室内户型人机共创模板。每个对象必须匹配并加载真实受管资产，禁止色块、轮廓体和方盒替身；缺资产时先完成正式资产准入再重跑。保存按钮必须下载包含当前完整状态的新 HTML，并提示用户把它发回；收到回传 HTML 后原子覆盖工作区唯一 current.html/current-model.json，禁止 localStorage、旧 HTML 或第二套结构参与事实发现。随后只做非阻断动线提示并交给算法机位。"
policy:
  allow_implicit_invocation: true
