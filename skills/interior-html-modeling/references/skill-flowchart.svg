<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1697" viewBox="0 0 2400 1697"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#111"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}</style></defs><rect width="2400" height="1697" fill="#fff"/><text x="42" y="55" font-size="30" font-weight="800" text-anchor="start"><tspan x="42" dy="0">室内户型人机共创 HTML 建模 / Skill 总览</tspan></text><text x="42" y="91" font-size="17" font-weight="430" text-anchor="start"><tspan x="42" dy="0">唯一流程：当前户型事实 → 精确资产匹配 → 当前项目模型 → 可编辑单文件 HTML → 用户回传覆盖当前版。</tspan></text><line x1="42" y1="112" x2="2358" y2="112" stroke="#111" stroke-width="2"/><g><polyline points="530,685 830,685" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="635" y="653" width="90" height="24" rx="3" fill="#fff" fill-opacity="0.94"/><text x="680" y="669.08" text-anchor="middle" font-size="12" font-weight="600" fill="#111"><tspan x="680" dy="0">当前户型事实</tspan></text></g><g><polyline points="1590,685 1880,685" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1690" y="653" width="90" height="24" rx="3" fill="#fff" fill-opacity="0.94"/><text x="1735" y="669.08" text-anchor="middle" font-size="12" font-weight="600" fill="#111"><tspan x="1735" dy="0">真实资产模型</tspan></text></g><g data-scenario-input="build-editable-html"><g><polygon points="106,560 530,560 504,810 80,810" fill="#fff" stroke="#111" stroke-width="2"/><text x="305" y="662.25" text-anchor="middle" font-size="16" font-weight="700" fill="#111"><tspan x="305" dy="0">输入当前户型编译结果</tspan></text><text x="305" y="681.75" text-anchor="middle" font-size="10.5" font-weight="430" fill="#111"><tspan x="305" dy="0">[这一步谁做什么] 建模 Agent 读取同一户型版本的结构和家具对象，不从旧 HTML 或示例模</tspan><tspan x="305" dy="14">型猜数据。</tspan><tspan x="305" dy="14">[这一步会做] 墙门窗、空间、家具描线和项目身份</tspan><tspan x="305" dy="14">[使用文件] SKILL.md；这个文件用来规定 HTML 建模的触发条件与唯一产品边界。</tspan></text></g></g><g><g><rect x="830" y="500" width="760" height="370" rx="5" fill="#f1f1f1" stroke="#111" stroke-width="2"/><text x="1210" y="655.25" text-anchor="middle" font-size="16" font-weight="700" fill="#111"><tspan x="1210" dy="0">匹配真实资产并编译当前项目模型</tspan></text><text x="1210" y="674.75" text-anchor="middle" font-size="10.5" font-weight="430" fill="#111"><tspan x="1210" dy="0">[这一步谁做什么] 唯一匹配器规范功能类别、物化真实资产并编译当前项目自己的模型。</tspan><tspan x="1210" dy="14">[这一步会做] 每件家具都有真实 GLB</tspan><tspan x="1210" dy="14">[这一步会做] 色块、轮廓体和示例模型不能进入正式项目</tspan><tspan x="1210" dy="14">[使用文件] scripts/match_trace_components.mjs；这个文件用来为每个描线对象选择同功能真实资产，这个文件在当前步骤提供正式依据。</tspan><tspan x="1210" dy="14">[使用文件] scripts/compile_coauthoring_model.mjs；这个文件用来把当前结构和资产合成唯一编辑器模型，这个文件在当前步骤提供正式依据。</tspan></text></g></g><g><g><path d="M 1880 553 A 225 13 0 0 1 2330 553 L 2330 817 A 225 13 0 0 1 1880 817 Z" fill="#fff" stroke="#111" stroke-width="2"/>
      <ellipse cx="2105" cy="553" rx="225" ry="13" fill="#fff" stroke="#111" stroke-width="2"/>
      <path d="M 1880 817 A 225 13 0 0 0 2330 817" fill="none" stroke="#111" stroke-width="2"/><text x="2105" y="648.25" text-anchor="middle" font-size="16" font-weight="700" fill="#111"><tspan x="2105" dy="0">交付可编辑整屋 HTML</tspan></text><text x="2105" y="667.75" text-anchor="middle" font-size="10.5" font-weight="430" fill="#111"><tspan x="2105" dy="0">[这一步谁做什么] 建模 Agent 交付自包含 HTML，并在用户回传后原子覆盖项目唯一当前版</tspan><tspan x="2105" dy="14">。</tspan><tspan x="2105" dy="14">[这一步会做] 用户可改墙、门窗和精细家具</tspan><tspan x="2105" dy="14">[这一步会做] 保存后把新 HTML 发回模型</tspan><tspan x="2105" dy="14">[使用文件] data_contract.md；这个文件用来规定当前 HTML、模型和回传覆盖关系，这个</tspan><tspan x="2105" dy="14">文件在当前步骤提供正式依据。</tspan></text></g></g><line x1="42" y1="1660" x2="2358" y2="1660" stroke="#aaa"/><text x="42" y="1682" font-size="12.5" fill="#555">唯一来源：references/skill-manual.json</text><text x="2358" y="1682" text-anchor="end" font-size="12.5" fill="#555">1 / 1</text></svg>