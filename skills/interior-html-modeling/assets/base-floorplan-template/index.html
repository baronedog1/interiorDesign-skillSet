<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>室内白模结构建模</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/controls/OrbitControls.js": "./vendor/controls/OrbitControls.js",
        "three/addons/loaders/GLTFLoader.js": "./vendor/loaders/GLTFLoader.js",
        "@interior/library-contract": "./component-library/shared/library-contract.js",
        "@interior/movable-green-catalog": "./component-library/movable-green/catalog.js",
        "@interior/fixed-purple-catalog": "./component-library/fixed-purple/catalog.js",
        "@interior/component-catalog": "./component-library/index.js",
        "@interior/component-library": "./component-library/component-library.js",
        "@interior/placement-geometry": "./component-library/shared/placement-geometry.js"
      }
    }
  </script>
</head>
<body>
  <header class="appbar">
    <div class="brand-block">
      <strong id="model-name">室内白模结构建模</strong>
      <span id="model-stats">载入中</span>
    </div>
    <div class="toolbar" role="toolbar" aria-label="建模工具">
      <button id="undo" class="icon-button" type="button" aria-label="撤销" title="撤销" disabled>↶</button>
      <button id="redo" class="icon-button" type="button" aria-label="重做" title="重做" disabled>↷</button>
      <div class="segmented" aria-label="视图">
        <button id="view-top" type="button" class="active">平面</button>
        <button id="view-iso" type="button">三维</button>
      </div>
      <div class="segmented appearance-switch" aria-label="结构外观">
        <button id="appearance-white" type="button" class="active" title="中性白模检查外观">白模</button>
        <button id="appearance-concrete" type="button" title="水泥毛坯外观，不改变结构">水泥</button>
      </div>
      <div class="segmented furniture-appearance-switch" aria-label="公共组件外观">
        <button id="furniture-white" type="button" class="active" aria-label="全部组件显示白模" title="全部组件白模"><i class="appearance-swatch white"></i></button>
        <button id="furniture-color" type="button" aria-label="全部组件显示项目材质" title="全部组件项目材质；未指定饰面时保留来源材质"><i class="appearance-swatch color"></i></button>
      </div>
      <button id="toggle-ceilings" class="icon-button compact-text-icon" type="button" aria-label="显示或隐藏天花板" title="显示或隐藏天花板" aria-pressed="false">顶</button>
      <button id="toggle-camera-preview" class="preview-mode-button" type="button" aria-pressed="false" title="在平面与三维视图左上角持续显示当前摄像头实时画面">预览</button>
      <div class="room-filter-menu">
        <button id="room-filter-toggle" class="room-filter-toggle" type="button" aria-haspopup="true" aria-expanded="false">
          <span>空间筛选</span>
          <small id="room-filter-summary">全部空间</small>
        </button>
        <div id="room-filter-popover" class="room-filter-popover" role="dialog" aria-label="空间筛选" hidden>
          <div class="room-filter-actions">
            <button id="room-filter-all" type="button">全选</button>
            <button id="room-filter-clear" type="button">清空</button>
          </div>
          <div id="room-filter-options" class="room-filter-options"></div>
        </div>
      </div>
      <button id="toggle-annotations" class="icon-button compact-text-icon" type="button" aria-label="显示空间边界、名称与面积" title="空间边界、名称与面积" aria-pressed="false">Aa</button>
      <button id="toggle-measure" class="icon-button" type="button" aria-label="两点量尺" title="两点量尺" aria-pressed="false">↔</button>
      <button id="clear-measure" class="icon-button" type="button" aria-label="清除量尺" title="清除量尺" disabled>×</button>
      <button id="toggle-source" class="icon-button" type="button" aria-label="显示二维依据" title="二维依据" aria-pressed="false">▦</button>
    </div>
  </header>

  <main id="workspace">
    <aside id="reference-drawer" class="reference-drawer" aria-label="二维依据图" aria-hidden="true">
      <div class="reference-heading">
        <strong>二维依据</strong>
        <button id="close-source" class="icon-button" type="button" aria-label="关闭二维依据" title="关闭">×</button>
      </div>
      <div class="reference-legend"><span><i class="wall-swatch"></i>墙</span><span><i class="window-swatch"></i>窗</span></div>
      <img id="source-image" src="./structure-source.png" alt="第三象限红墙蓝窗结构依据图">
    </aside>

    <section class="scene-shell" aria-label="三维建模画布">
      <div id="scene"></div>
      <div id="camera-live-preview" class="camera-live-preview" aria-live="polite" hidden>
        <canvas id="camera-live-preview-canvas" width="320" height="180" aria-label="当前场景摄像头实时画面"></canvas>
        <strong>摄像头实时视角</strong>
        <span id="camera-live-preview-meta"></span>
        <button id="camera-preview-resize-handle" class="camera-preview-resize-handle" type="button" aria-label="拖动调整预览窗大小" title="拖动调整预览窗大小；双击恢复默认大小">↘</button>
      </div>
      <div id="room-annotations" class="scene-overlay scene-annotations passive-annotations" aria-label="空间文字标注层"></div>
      <div id="dimension-annotations" class="scene-overlay dimension-annotations passive-annotations" aria-label="户型总尺寸标注层">
        <div class="dimension-line dimension-width"><span id="dimension-width-label">总宽</span></div>
        <div class="dimension-line dimension-depth"><span id="dimension-depth-label">总深</span></div>
      </div>
      <div id="measurement-label" class="measurement-label" role="status" hidden></div>
      <div id="selection-chip" class="selection-chip passive-annotations" hidden></div>
      <div id="view-toast" class="view-toast" role="status" aria-live="polite" hidden></div>
    </section>

    <aside class="editor-panel" aria-label="对象编辑器">
      <div class="editor-tabs" role="tablist" aria-label="编辑分类">
        <button id="tab-structure" class="active" type="button" role="tab" aria-selected="true" data-panel="structure-panel">结构</button>
        <button id="tab-furniture" type="button" role="tab" aria-selected="false" data-panel="furniture-panel">组件</button>
        <button id="tab-scene" type="button" role="tab" aria-selected="false" data-panel="scene-panel">场景</button>
        <button id="tab-layers" type="button" role="tab" aria-selected="false" data-panel="layers-panel">图层</button>
      </div>

      <section id="structure-panel" class="editor-section active" role="tabpanel">
        <div class="section-heading">
          <strong>墙与窗</strong>
          <span id="structure-count"></span>
        </div>
        <div id="structure-list" class="object-list"></div>
        <div id="structure-inspector" class="inspector"></div>
      </section>

      <section id="furniture-panel" class="editor-section" role="tabpanel" hidden>
        <div class="section-heading">
          <strong>描线匹配组件</strong>
          <span id="furniture-count"></span>
          <div class="section-command-bar" role="toolbar" aria-label="组件操作">
            <button id="delete-component" class="section-icon-button danger" type="button" aria-label="删除选中组件" title="删除选中组件" disabled>×</button>
          </div>
        </div>
        <div id="furniture-list" class="object-list"></div>
        <div id="furniture-inspector" class="inspector"></div>
        <a class="component-library-link" href="./component-library/gallery/index.html">打开公共源码组件库</a>
      </section>

      <section id="scene-panel" class="editor-section" role="tabpanel" hidden>
        <div class="section-heading"><strong>场景控制</strong><span id="scene-count"></span></div>
        <div class="scene-tool-switch" role="tablist" aria-label="场景对象类型">
          <button id="scene-mode-light" class="active" type="button" role="tab" aria-selected="true" data-scene-mode="light">光</button>
          <button id="scene-mode-camera" type="button" role="tab" aria-selected="false" data-scene-mode="camera">摄像头</button>
        </div>
        <div class="scene-command-bar">
          <button id="add-light" class="icon-button scene-add-button" type="button" aria-label="添加光" title="添加光">+</button>
          <button id="add-camera" class="icon-button scene-add-button" type="button" aria-label="添加摄像头" title="添加摄像头" hidden>+</button>
          <button id="export-scene-rig" class="icon-button" type="button" aria-label="导出场景设置" title="导出场景设置">⇩</button>
          <label class="gizmo-control" title="只显示或隐藏 XYZ 操纵轴与焦点线；灯和摄像头不会隐藏">
            <span>辅助线</span>
            <input id="toggle-rig-gizmos" type="checkbox" checked>
          </label>
        </div>
        <div id="light-mode-content" class="scene-mode-content" data-scene-content="light">
          <div class="scene-subheading"><strong>光</strong><span id="light-count"></span></div>
          <div id="light-list" class="object-list"></div>
        </div>
        <div id="camera-mode-content" class="scene-mode-content" data-scene-content="camera" hidden>
          <div class="scene-subheading"><strong>摄像头</strong><span id="camera-count"></span></div>
          <div id="camera-list" class="object-list"></div>
        </div>
        <div id="scene-inspector" class="inspector"></div>
        <section id="camera-plan-deck" class="camera-plan-deck" hidden aria-label="已保存机位">
          <div class="scene-subheading camera-plan-heading">
            <div>
              <strong>已保存机位</strong>
              <small>焦点、位置、镜头、局部遮挡与打光的组合</small>
            </div>
            <span id="camera-plan-count"></span>
            <button id="import-camera-plan" class="scene-icon-action" type="button" data-tooltip="载入本户型的 camera-plan.json" aria-label="载入机位 JSON" title="载入机位 JSON">⇧</button>
            <input id="camera-plan-file" type="file" accept=".json,application/json" hidden>
          </div>
          <div id="camera-plan-list" class="object-list camera-plan-list"></div>
          <p class="camera-plan-help">点击机位会把组合参数临时套入当前摄像头；再次点击同一机位，恢复切换前的摄像头与灯光。</p>
        </section>
      </section>

      <section id="layers-panel" class="editor-section" role="tabpanel" hidden>
        <div class="section-heading"><strong>显示</strong></div>
        <div id="layer-controls" class="layer-controls"></div>
      </section>

      <div id="action-status" class="action-status" role="status">模型载入中</div>
    </aside>
  </main>

  <pre id="runtime-audit" hidden></pre>
  <script type="module" src="./app.js"></script>
</body>
</html>
