<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>室内公共源码组件库</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../../vendor/three.module.js",
        "three/addons/controls/OrbitControls.js": "../../vendor/controls/OrbitControls.js",
        "three/addons/loaders/GLTFLoader.js": "../../vendor/loaders/GLTFLoader.js",
        "@interior/library-contract": "../shared/library-contract.js",
        "@interior/movable-green-catalog": "../movable-green/catalog.js",
        "@interior/fixed-purple-catalog": "../fixed-purple/catalog.js",
        "@interior/component-catalog": "../index.js",
        "@interior/component-library": "../component-library.js"
      }
    }
  </script>
</head>
<body>
  <header class="library-header">
    <div>
      <strong>室内公共源码组件库</strong>
      <span id="library-summary">载入中</span>
    </div>
    <a href="../../index.html" class="back-link">返回结构模型</a>
  </header>

  <main class="library-layout">
    <aside class="catalog-pane" aria-label="原组件目录">
      <div class="catalog-tools">
        <label>
          <span>搜索</span>
          <input id="component-search" type="search" placeholder="名称、用途或形态" autocomplete="off">
        </label>
        <label>
          <span>分库</span>
          <select id="partition-filter">
            <option value="all">全部分库</option>
            <option value="movable-green">绿色活动家具</option>
            <option value="fixed-purple">紫色固定组件</option>
          </select>
        </label>
        <label>
          <span>类别</span>
          <select id="category-filter">
            <option value="all">全部类别</option>
          </select>
        </label>
      </div>
      <div class="catalog-result">
        <strong id="result-count">0 个组件</strong>
        <span>点击查看三维模型</span>
      </div>
      <div id="component-list" class="component-list"></div>
    </aside>

    <section class="viewer-pane" aria-label="原组件三维查看器">
      <div id="component-viewer" class="component-viewer"></div>
      <div class="viewer-toolbar" role="toolbar" aria-label="查看器工具">
        <div class="segmented">
          <button id="view-iso" class="active" type="button">三维</button>
          <button id="view-front" type="button">正视</button>
          <button id="view-top" type="button">俯视</button>
        </div>
        <div class="segmented appearance-segmented" aria-label="组件外观">
          <button id="appearance-white" class="active" type="button">白模</button>
          <button id="appearance-color" type="button">原色</button>
        </div>
        <button id="reset-view" type="button">复位视角</button>
      </div>
      <section class="component-detail" aria-live="polite">
        <div class="detail-heading">
          <div>
            <strong id="detail-name">请选择组件</strong>
            <span id="detail-id"></span>
          </div>
          <span id="detail-class" class="class-chip"></span>
        </div>
        <dl class="detail-grid">
          <div><dt>标准尺寸</dt><dd id="detail-dimensions">-</dd></div>
          <div><dt>合理缩放</dt><dd id="detail-scale">-</dd></div>
          <div><dt>几何形态</dt><dd id="detail-shape">-</dd></div>
          <div><dt>描线来源</dt><dd id="detail-placement">-</dd></div>
          <div><dt>外观状态</dt><dd id="detail-appearance">-</dd></div>
          <div><dt>模型来源</dt><dd id="detail-source">-</dd></div>
        </dl>
        <div>
          <span class="detail-label">可调参数</span>
          <div id="detail-parameters" class="tag-list"></div>
        </div>
        <div>
          <span class="detail-label">匹配关键词</span>
          <div id="detail-tags" class="tag-list"></div>
        </div>
      </section>
    </section>
  </main>

  <pre id="library-audit" hidden></pre>
  <script type="module" src="./explorer.js"></script>
</body>
</html>
