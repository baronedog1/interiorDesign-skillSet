<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1480pt" height="707pt" viewBox="0 0 1480 707"><rect width="1480" height="707" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="30" y="48" font-size="20" fill="#172F43" font-weight="700">可编辑模型与定制节点 / 总图：从用户当前布局到可编辑模型</text><text x="30" y="73" font-size="10.2" fill="#4B6172" font-weight="500">SPM 14.4.0 · schema 5 · 从触发到交付的完整流程 · 深蓝节点可展开</text><rect x="24" y="84" width="1432" height="33" rx="5" fill="#F3F6F8"/><text x="36" y="103" font-size="11" fill="#172F43" font-weight="400">触发：用户要求按当前布局制作或继续修改可编辑室内模型；输入：用户提供当前布局、同版需求或最新完整模型；输出：完整离线模型、同版场景及待核说明</text><g transform="translate(24,129)"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#596F80"/></marker></defs><g transform="translate(0,0)"><polyline data-from="n0" data-to="n1" points="438,143.5 526,143.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="n1" data-to="n2" points="906,143.5 994,143.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="n2" data-to="n3" points="1184,224.5 1184,307.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="n3" data-to="n4" points="994,388.5 906,388.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="n4" data-to="n5" points="526,388.5 438,388.5" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g id="node-main-n0" data-node="n0"><rect x="58" y="68.5" width="380" height="150" rx="8" fill="#EAF6EF" stroke="#4F8D70" stroke-width="2"/><path d="M 413 90.5 h12 l-3 10 h-12 Z" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="163.25900000000001" x2="421" y2="163.25900000000001" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="98" font-size="10.5" fill="#15548D" font-weight="700">开始 · 用户提供</text><text x="75" y="124.885" font-size="18" fill="#172F43" font-weight="700">用户给布局或最新完整模型</text><text x="75" y="148.745" font-size="12.2" fill="#172F43" font-weight="400">读取同版需求；已有用户修改以最新完整模型为准。</text><text x="75" y="181.459" font-size="10.2" fill="#263F52" font-weight="500">[入口] SKILL.md</text><text x="75" y="197.53300000000002" font-size="10.3" fill="#4B6172" font-weight="400">接收布局、最新模型及用户要求，确定本次建模与交付范围</text></g><g id="node-main-n1" data-node="n1"><rect x="526" y="58" width="380" height="171" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="881" y="80" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="543" y1="138.374" x2="889" y2="138.374" stroke="#D8E0E6" stroke-width=".8"/><text x="543" y="100" font-size="18" fill="#172F43" font-weight="700">选择对象方法与用户参数</text><text x="543" y="123.86" font-size="12.2" fill="#172F43" font-weight="400">已确认尺寸和偏好只约束本项目；未知与允许发挥分开。</text><text x="543" y="156.574" font-size="10.2" fill="#263F52" font-weight="500">[方法] playbook/rule-selection.md</text><text x="543" y="172.648" font-size="10.3" fill="#4B6172" font-weight="400">区分通用构造方法与本项目尺寸、偏好和明确覆盖</text><text x="543" y="191.659" font-size="10.2" fill="#263F52" font-weight="500">[方法] local_runtime.md</text><text x="543" y="207.733" font-size="10.3" fill="#4B6172" font-weight="400">说明运行依赖、正式命令以及维护说明书和安装副本的方法</text></g><g id="node-main-n2" data-node="n2"><a href="#page-2" xlink:href="#page-2"><rect x="994" y="62.5" width="380" height="162" rx="8" fill="#15548D" stroke="#15548D" stroke-width="2"/><rect x="1349" y="84.5" width="10" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.3"/><line x1="1011" y1="142.874" x2="1357" y2="142.874" stroke="#6291B7" stroke-width=".8"/><text x="1011" y="104.5" font-size="18" fill="#FFFFFF" font-weight="700">按真实尺寸构造板件和节点</text><text x="1011" y="128.36" font-size="12.2" fill="#F0F7FF" font-weight="400">选择结构家族、独立台面与真实门窗；资源用途见展开。</text><text x="1011" y="161.074" font-size="10.2" fill="#FFFFFF" font-weight="500">[方法] playbook/joinery.md</text><text x="1011" y="177.148" font-size="10.3" fill="#DCEBFA" font-weight="400">按板厚、分区、独立台面孔与锚点构造柜桌及床台</text><text x="1011" y="202.659" font-size="10.7" fill="#FFFFFF" font-weight="700">D1 · 展开见第2页</text></a></g><g id="node-main-n5" data-node="n5"><rect x="58" y="305" width="380" height="167" rx="8" fill="#EAF6EF" stroke="#4F8D70" stroke-width="2"/><path d="M 413 327 h12 l-3 10 h-12 Z" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="416.473" x2="421" y2="416.473" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="334.5" font-size="10.5" fill="#15548D" font-weight="700">结束 · 本次交付</text><text x="75" y="361.385" font-size="18" fill="#172F43" font-weight="700">用户获得完整模型与场景数据</text><text x="75" y="385.245" font-size="12.2" fill="#172F43" font-weight="400">交付可离线编辑的完整页面和同版场景；待核事项保留</text><text x="75" y="401.959" font-size="12.2" fill="#172F43" font-weight="400">说明。</text><text x="75" y="434.673" font-size="10.2" fill="#263F52" font-weight="500">[数据] data_contract.md</text><text x="75" y="450.747" font-size="10.3" fill="#4B6172" font-weight="400">规定布局、编辑状态、场景摘要和同版需求交接</text></g><g id="node-main-n4" data-node="n4"><a href="#page-4" xlink:href="#page-4"><rect x="526" y="307.5" width="380" height="162" rx="8" fill="#15548D" stroke="#15548D" stroke-width="2"/><rect x="881" y="329.5" width="10" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.3"/><line x1="543" y1="387.874" x2="889" y2="387.874" stroke="#6291B7" stroke-width=".8"/><text x="543" y="349.5" font-size="18" fill="#FFFFFF" font-weight="700">编辑关联、保存并交接同版</text><text x="543" y="373.36" font-size="12.2" fill="#F0F7FF" font-weight="400">以最终完整页面恢复编辑状态；交接当前需求与版本。</text><text x="543" y="406.074" font-size="10.2" fill="#FFFFFF" font-weight="500">[模块] scripts/engine/runtime/workspace.js</text><text x="543" y="422.148" font-size="10.3" fill="#DCEBFA" font-weight="400">处理结构与家具编辑、量尺、撤销重做及完整HTML保存和导入</text><text x="543" y="447.659" font-size="10.7" fill="#FFFFFF" font-weight="700">D3 · 展开见第4页</text></a></g><g id="node-main-n3" data-node="n3"><a href="#page-3" xlink:href="#page-3"><rect x="994" y="307.5" width="380" height="162" rx="8" fill="#15548D" stroke="#15548D" stroke-width="2"/><rect x="1349" y="329.5" width="10" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.3"/><line x1="1011" y1="387.874" x2="1357" y2="387.874" stroke="#6291B7" stroke-width=".8"/><text x="1011" y="349.5" font-size="18" fill="#FFFFFF" font-weight="700">生成当前离线编辑模板</text><text x="1011" y="373.36" font-size="12.2" fill="#F0F7FF" font-weight="400">正式构建同时输出完整页面、当前布局与绑定场景。</text><text x="1011" y="406.074" font-size="10.2" fill="#FFFFFF" font-weight="500">[执行] scripts/run.py</text><text x="1011" y="422.148" font-size="10.3" fill="#DCEBFA" font-weight="400">将正式建模命令路由到本包引擎，并记录命令时间</text><text x="1011" y="447.659" font-size="10.7" fill="#FFFFFF" font-weight="700">D2 · 展开见第3页</text></a></g></g></g><text x="30" y="689" font-size="9.2" fill="#4B6172" font-weight="400">从绿色“开始”顺箭头读到“结束”。深蓝D节点可展开；小字用于查具体文件。</text><text x="1450" y="689" text-anchor="end" font-size="9.2" fill="#4B6172">1 / 4</text></g></svg>