<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1192pt" height="2160pt" viewBox="0 0 1192 2160"><rect width="1192" height="2160" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="30" y="48" font-size="20" fill="#172F43" font-weight="700">单品照片到三维 HTML / 总图：从产品原图，到可以旋转编辑的成品</text><text x="30" y="73" font-size="10.2" fill="#4B6172" font-weight="500">SPM 14.4.0 · schema 5 · 从触发到交付的完整流程 · 深蓝节点可展开</text><rect x="24" y="84" width="1144" height="33" rx="5" fill="#F3F6F8"/><text x="36" y="103" font-size="11" fill="#172F43" font-weight="400">触发：用户要求照片单品建模或修改、相关咨询或维护；输入：原始照片、已确认要求与当前文件；输出：三维HTML、源码、对照与已验证状态</text><g transform="translate(24,129)"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#596F80"/></marker></defs><g transform="translate(0,0)"><polyline data-from="input" data-to="scope" points="293,208 293,336" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="scope" data-to="geometry" points="170.8,450 170.8,556 293,556 293,578" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="scope" data-to="other" points="528,363.36 594,363.36 594,393 616,393" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="geometry" data-to="surface" points="293,796 293,872" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="surface" data-to="build" points="293,1043 293,1119" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="build" data-to="verify" points="293,1465 293,1541" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="verify" data-to="deliver" points="293,1699 293,1753 170.8,1753 170.8,1775" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline data-from="other" data-to="deliver" points="851,502 851,1811 528,1811" fill="none" stroke="#596F80" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><g id="node-main-input" data-node="input"><rect x="58" y="58" width="470" height="150" rx="8" fill="#EAF6EF" stroke="#4F8D70" stroke-width="2"/><path d="M 503 80 h12 l-3 10 h-12 Z" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="152.75900000000001" x2="511" y2="152.75900000000001" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="87.5" font-size="10.5" fill="#15548D" font-weight="700">开始 · 用户提供</text><text x="75" y="114.385" font-size="18" fill="#172F43" font-weight="700">用户给产品照片和制作要求</text><text x="75" y="138.245" font-size="12.2" fill="#172F43" font-weight="400">保留原始照片、确认尺寸、修改意见和现有文件。</text><text x="75" y="170.959" font-size="10.2" fill="#263F52" font-weight="500">[入口] SKILL.md</text><text x="75" y="187.03300000000002" font-size="10.3" fill="#4B6172" font-weight="400">识别单品建模请求、路由及最终交付范围</text></g><g id="node-main-scope" data-node="scope"><rect x="58" y="336" width="470" height="114" rx="8" fill="#FFF8EB" stroke="#D8BA81" stroke-width="1.1"/><path d="M 508 357 l 6 6 -6 6 -6 -6 Z" fill="none" stroke="#91651B" stroke-width="1.6"/><line x1="75" y1="394.66" x2="511" y2="394.66" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="378" font-size="18" fill="#172F43" font-weight="700">这次需要制作或修改形体吗？</text><text x="75" y="412.86" font-size="10.2" fill="#263F52" font-weight="500">[入口] SKILL.md</text><text x="75" y="428.93399999999997" font-size="10.3" fill="#4B6172" font-weight="400">识别单品建模请求、路由及最终交付范围</text></g><g id="node-main-other" data-node="other"><a href="#page-3" xlink:href="#page-3"><rect x="616" y="284" width="470" height="218" rx="8" fill="#15548D" stroke="#15548D" stroke-width="2"/><rect x="1061" y="306" width="10" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.3"/><line x1="633" y1="386.08799999999997" x2="1069" y2="386.08799999999997" stroke="#6291B7" stroke-width=".8"/><text x="633" y="326" font-size="18" fill="#FFFFFF" font-weight="700">按当前任务处理已有材料</text><text x="633" y="349.86" font-size="12.2" fill="#F0F7FF" font-weight="400">咨询、发送、确定数据编译或只截图，按本次要求处理。</text><text x="633" y="371.574" font-size="12.2" fill="#F0F7FF" font-weight="400">只有改技能代码或规则时进入改版详情。</text><text x="633" y="404.288" font-size="10.2" fill="#FFFFFF" font-weight="500">[入口] SKILL.md</text><text x="633" y="420.36199999999997" font-size="10.3" fill="#DCEBFA" font-weight="400">识别单品建模请求、路由及最终交付范围</text><text x="633" y="439.373" font-size="10.2" fill="#FFFFFF" font-weight="500">[方法] local_runtime.md</text><text x="633" y="455.447" font-size="10.3" fill="#DCEBFA" font-weight="400">任务依赖安装、构建命令与设备同步方法</text><text x="633" y="480.95799999999997" font-size="10.7" fill="#FFFFFF" font-weight="700">D2 · 展开见第3页</text></a></g><g id="node-main-geometry" data-node="geometry"><a href="#page-2" xlink:href="#page-2"><rect x="58" y="578" width="470" height="218" rx="8" fill="#15548D" stroke="#15548D" stroke-width="2"/><rect x="503" y="600" width="10" height="10" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.3"/><line x1="75" y1="680.088" x2="511" y2="680.088" stroke="#6291B7" stroke-width=".8"/><text x="75" y="620" font-size="18" fill="#FFFFFF" font-weight="700">按原图校准形体和连接</text><text x="75" y="643.86" font-size="12.2" fill="#F0F7FF" font-weight="400">先骨架与机位，再局部排列、截面和接头。</text><text x="75" y="665.574" font-size="12.2" fill="#F0F7FF" font-weight="400">背面可合理推测，可见处同机位核对。</text><text x="75" y="698.288" font-size="10.2" fill="#FFFFFF" font-weight="500">[方法] playbook/geometry.md</text><text x="75" y="714.362" font-size="10.3" fill="#DCEBFA" font-weight="400">从款式特征、留空、截面及接头选择真实几何表示</text><text x="75" y="733.373" font-size="10.2" fill="#FFFFFF" font-weight="500">[数据] data_contract.md</text><text x="75" y="749.447" font-size="10.3" fill="#DCEBFA" font-weight="400">规定生成器、真实锚点、单位、编辑与保存对象</text><text x="75" y="774.958" font-size="10.7" fill="#FFFFFF" font-weight="700">D1 · 展开见第2页</text></a></g><g id="node-main-surface" data-node="surface"><rect x="58" y="872" width="470" height="171" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="503" y="894" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="952.374" x2="511" y2="952.374" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="914" font-size="18" fill="#172F43" font-weight="700">按部件贴合材质颜色和光影</text><text x="75" y="937.86" font-size="12.2" fill="#172F43" font-weight="400">先材质和颜色，再调灯光；花纹不抵消形体偏差。</text><text x="75" y="970.574" font-size="10.2" fill="#263F52" font-weight="500">[方法] playbook/surfaces.md</text><text x="75" y="986.648" font-size="10.3" fill="#4B6172" font-weight="400">根据源图分组件建立颜色、纹理和光影</text><text x="75" y="1005.659" font-size="10.2" fill="#263F52" font-weight="500">[模块] scripts/materials.mjs</text><text x="75" y="1021.733" font-size="10.3" fill="#4B6172" font-weight="400">在真实曲面建立UV材质与按类别遮挡筛选的照片投影</text></g><g id="node-main-build" data-node="build"><rect x="58" y="1119" width="470" height="346" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="503" y="1141" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="1199.374" x2="511" y2="1199.374" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="1161" font-size="18" fill="#172F43" font-weight="700">生成完整离线工作台</text><text x="75" y="1184.86" font-size="12.2" fill="#172F43" font-weight="400">模型、图片和运行库内联；保留实际可用编辑工具。</text><text x="75" y="1217.574" font-size="10.2" fill="#263F52" font-weight="500">[执行] scripts/build-workbench.mjs</text><text x="75" y="1233.648" font-size="10.3" fill="#4B6172" font-weight="400">将生成器与唯一工作台打入离线单文件HTML</text><text x="75" y="1252.659" font-size="10.2" fill="#263F52" font-weight="500">[模板] assets/workbench/workbench.html</text><text x="75" y="1268.733" font-size="10.3" fill="#4B6172" font-weight="400">唯一产品工作台的界面和控件</text><text x="75" y="1287.744" font-size="10.2" fill="#263F52" font-weight="500">[模块] assets/workbench/workbench.js</text><text x="75" y="1303.818" font-size="10.3" fill="#4B6172" font-weight="400">执行视图、选件、编辑、导入导出与保存重开</text><text x="75" y="1322.829" font-size="10.2" fill="#263F52" font-weight="500">[模块] assets/workbench/product-kernel.js</text><text x="75" y="1338.903" font-size="10.3" fill="#4B6172" font-weight="400">解释产品参数及装配定义</text><text x="75" y="1357.914" font-size="10.2" fill="#263F52" font-weight="500">[模块] assets/workbench/gltf-io.js</text><text x="75" y="1373.9879999999998" font-size="10.3" fill="#4B6172" font-weight="400">读写GLB网格、基础材质和统一UV变换</text><text x="75" y="1392.9989999999998" font-size="10.2" fill="#263F52" font-weight="500">[依赖] assets/workbench/LICENSE-Three.js.txt</text><text x="75" y="1409.0729999999999" font-size="10.3" fill="#4B6172" font-weight="400">保留工作台运行库的许可信息</text><text x="75" y="1428.0839999999998" font-size="10.2" fill="#263F52" font-weight="500">[配置] scripts/package.json</text><text x="75" y="1444.158" font-size="10.3" fill="#4B6172" font-weight="400">声明任务目录使用的固定依赖版本</text></g><g id="node-main-verify" data-node="verify"><rect x="58" y="1541" width="470" height="158" rx="8" fill="#F4F7FA" stroke="#BDC9D1" stroke-width="1.1"/><rect x="503" y="1563" width="10" height="10" rx="2" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="1643.088" x2="511" y2="1643.088" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="1583" font-size="18" fill="#172F43" font-weight="700">打开成品核对形体和操作</text><text x="75" y="1606.86" font-size="12.2" fill="#172F43" font-weight="400">实际本地打开，检查同版截图、离线和保存重开。</text><text x="75" y="1628.574" font-size="12.2" fill="#172F43" font-weight="400">受阻项与已通过项分别记录；局部返修后重验。</text><text x="75" y="1661.288" font-size="10.2" fill="#263F52" font-weight="500">[方法] expected_outcome/expected_outcome.md</text><text x="75" y="1677.362" font-size="10.3" fill="#4B6172" font-weight="400">区分形体对应、浏览器运行及未完成事项</text></g><g id="node-main-deliver" data-node="deliver"><rect x="58" y="1775" width="470" height="150" rx="8" fill="#EAF6EF" stroke="#4F8D70" stroke-width="2"/><path d="M 503 1797 h12 l-3 10 h-12 Z" fill="none" stroke="#4B6172" stroke-width="1.3"/><line x1="75" y1="1869.759" x2="511" y2="1869.759" stroke="#D8E0E6" stroke-width=".8"/><text x="75" y="1804.5" font-size="10.5" fill="#15548D" font-weight="700">结束 · 本次交付</text><text x="75" y="1831.385" font-size="18" fill="#172F43" font-weight="700">交付成品、源码、对照和限制</text><text x="75" y="1855.2450000000001" font-size="12.2" fill="#172F43" font-weight="400">核对本次成品、源码、实际对照和限制后交付。</text><text x="75" y="1887.959" font-size="10.2" fill="#263F52" font-weight="500">[入口] SKILL.md</text><text x="75" y="1904.033" font-size="10.3" fill="#4B6172" font-weight="400">识别单品建模请求、路由及最终交付范围</text></g><g><rect x="176.8" y="492" width="53.2" height="22" rx="3" fill="white"/><text x="182.8" y="507" font-size="10.3" fill="#172F43" font-weight="500">需要建模</text></g><g><rect x="534.4" y="336.36" width="53.2" height="22" rx="3" fill="white"/><text x="540.4" y="351.36" font-size="10.3" fill="#172F43" font-weight="500">无需建模</text></g></g></g><text x="30" y="2142" font-size="9.2" fill="#4B6172" font-weight="400">从绿色“开始”顺箭头读到“结束”。深蓝D节点可展开；小字用于查具体文件。</text><text x="1162" y="2142" text-anchor="end" font-size="9.2" fill="#4B6172">1 / 3</text></g></svg>