<text x="60" y="145" text-anchor="start" font-size="21" font-weight="400" fill="#222"><tspan x="60" dy="0">触发：用户要求单产品建模；输入：单品照片、尺寸或网格；交付：源码、真实模型、验收与产品手册</tspan></text><g><polyline points="715,415 880,415" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polyline points="1530,415 1695,415" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1531.5" y="374" width="162" height="29" rx="3" fill="#fff" fill-opacity="0.94"/><text x="1612.5" y="393.94" text-anchor="middle" font-size="16" font-weight="600" fill="#111"><tspan x="1612.5" dy="0">参数结构或已有网格</tspan></text></g><g><polyline points="1205,615 1205,652.5 1205,652.5 1205,690" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1217" y="618.25" width="198" height="31" rx="3" fill="#fff" fill-opacity="0.94"/><text x="1316" y="639.87" text-anchor="middle" font-size="18" font-weight="600" fill="#111"><tspan x="1316" dy="0">多视图来源与区域雕刻</tspan></text></g><g><polyline points="2020,615 2020,652.5 2020,652.5 2020,690" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polyline points="1530,890 1695,890" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><polyline points="2020,1090 2020,1140 1597.5,1140 1597.5,1190" fill="none" stroke="#111" stroke-width="2.2" marker-end="url(#arrow)"/></g><g><rect x="65" y="215" width="650" height="400" rx="5" fill="#f1f1f1" stroke="#111" stroke-width="2"/><text x="390" y="316" text-anchor="middle" font-size="23" font-weight="700" fill="#111"><tspan x="390" dy="0">接收任务与复用现有输入</tspan></text><text x="85" y="349" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="85" dy="0">单品照片、尺寸或网格</tspan></text><text x="85" y="375" text-anchor="start" font-size="20" font-weight="430" fill="#111"><tspan x="85" dy="0"></tspan></text><text x="85" y="401" text-anchor="start" font-size="16.4" font-weight="430" fill="#52616b"><tspan x="85" dy="0">README.m